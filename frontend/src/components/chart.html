<!-- HTML Structure -->
<div class="custom-image-gallery">
    <div class="main-image-container">
        <img id="main-image" src="https://arcobluatelier.com/wp-content/uploads/2025/04/3-2-scaled.webp" alt="Main Image">
    </div>
    <div class="thumbnail-container">
        <img class="thumbnail active" src="https://arcobluatelier.com/wp-content/uploads/2025/04/3-2-scaled.webp" alt="Thumbnail 1" data-img-id="1" onclick="customGalleryChangeImage(this)">
        <img class="thumbnail" src="https://arcobluatelier.com/wp-content/uploads/2025/04/3-4-scaled.webp" alt="Thumbnail 2" data-img-id="2" onclick="customGalleryChangeImage(this)">
        <img class="thumbnail" src="https://arcobluatelier.com/wp-content/uploads/2025/04/3-1-scaled.webp" alt="Thumbnail 3" data-img-id="3" onclick="customGalleryChangeImage(this)">
        <img class="thumbnail" src="https://arcobluatelier.com/wp-content/uploads/2025/04/3--scaled.webp" alt="Thumbnail 4" data-img-id="4" onclick="customGalleryChangeImage(this)">
        <img class="thumbnail" src="https://arcobluatelier.com/wp-content/uploads/2025/04/3-scaled.webp" alt="Thumbnail 5" data-img-id="5" onclick="customGalleryChangeImage(this)">
    </div>
</div>

<style>
.custom-image-gallery {
    max-width: 800px;
    margin: 0 auto;
}

.main-image-container {
    width: 100%;
    margin-bottom: 15px;
    overflow: hidden;
    border-radius: 5px;
}

#main-image {
    width: 100%;
    height: auto;
    display: block;
    transition: transform 0.3s ease;
}

#main-image:hover {
    transform: scale(1.02);
}

.thumbnail-container {
    display: flex;
    justify-content: space-between;
    gap: 10px;
}

.thumbnail {
    width: 18%;
    height: auto;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.3s ease;
    opacity: 0.7;
    border: 2px solid transparent;
}

.thumbnail:hover {
    opacity: 1;
}

.thumbnail.active {
    opacity: 1;
    border: 2px solid #3498db;
}
</style>

<script>
// Make sure this executes after page load
jQuery(document).ready(function($) {
    console.log("Gallery script loaded");
    
    // Get URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const selectedImageId = urlParams.get('img');
    console.log("Selected image ID from URL:", selectedImageId);
    
    if (selectedImageId) {
        // Find the thumbnail with the matching data-img-id
        const selectedThumbnail = document.querySelector(`.thumbnail[data-img-id="${selectedImageId}"]`);
        console.log("Found thumbnail:", selectedThumbnail);
        
        // If found, change to that image
        if (selectedThumbnail) {
            customGalleryChangeImage(selectedThumbnail);
        }
    }
});

function customGalleryChangeImage(thumbnailElement) {
    console.log("Changing image to:", thumbnailElement.src);
    // Update main image
    document.getElementById('main-image').src = thumbnailElement.src;
    
    // Change active state for thumbnails
    let thumbnails = document.getElementsByClassName('thumbnail');
    for (let i = 0; i < thumbnails.length; i++) {
        thumbnails[i].classList.remove('active');
    }
    thumbnailElement.classList.add('active');
}
</script>
